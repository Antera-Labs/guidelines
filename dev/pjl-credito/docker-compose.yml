# COAC Padre Julián Lorente · Sistema de crédito (entorno de desarrollo y demostración)
#   http://localhost:8081  Web Trx (Angular, personal)
#   http://localhost:8082  App del socio (React PWA)
#   http://localhost:8080  core-api (Groovy / Spring Boot)
#   localhost:1521         Oracle Free (servicio FREEPDB1, esquema PJL_CREDITO)
#   http://localhost:8025  Buzón de correo de desarrollo (Mailpit): recuperación de clave
name: pjl-credito

services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-PjlSys2026}
      APP_USER: PJL_CREDITO
      APP_USER_PASSWORD: ${PJL_DB_PASSWORD:-PjlCredito2026}
      NLS_LANG: AMERICAN_AMERICA.AL32UTF8
      TZ: America/Guayaquil
    ports: ["1521:1521"]
    volumes:
      - ./database/oracle:/opt/pjl/sql:ro,z
      - ./database/docker:/container-entrypoint-initdb.d:ro,z
      - oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  core-api:
    build: ./services/core-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-simulador}
      PJL_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      PJL_DB_USER: PJL_CREDITO
      PJL_DB_PASSWORD: ${PJL_DB_PASSWORD:-PjlCredito2026}
      PJL_JWT_SECRET: ${PJL_JWT_SECRET:-desarrollo-pjl-credito-clave-jwt-hs256-solo-local-2026}
      PJL_CORS: http://localhost:8081,http://localhost:8082
      # Integraciones: en producción apuntan al core, buró y nube privada reales
      PJL_CORE_URL: http://localhost:8080/sim/core
      PJL_EXTERNOS_URL: http://localhost:8080/sim/externos
      PJL_NUBE_URL: http://localhost:8080/sim/nube
      # Correo saliente: en desarrollo, Mailpit; en producción, el SMTP de la cooperativa
      PJL_SMTP_HOST: ${PJL_SMTP_HOST:-correo}
      PJL_SMTP_PORT: ${PJL_SMTP_PORT:-1025}
      PJL_WEB_URL: ${PJL_WEB_URL:-http://localhost:8081}
    ports: ["8080:8080"]
    volumes:
      - expediente:/var/pjl/expediente
    depends_on:
      oracle: { condition: service_healthy }
      correo: { condition: service_started }
    restart: unless-stopped

  # Buzón de desarrollo: recibe todo el correo SMTP y lo muestra en http://localhost:8025
  correo:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]
    restart: unless-stopped

  web:
    build: ./apps/web
    ports: ["8081:80"]
    depends_on: [core-api]

  movil:
    build: ./apps/movil
    ports: ["8082:80"]
    depends_on: [core-api]

volumes:
  oracle-datos:
  expediente:
