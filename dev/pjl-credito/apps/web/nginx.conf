# SPA + proxy a core-api. Las apps nunca hablan directo con Oracle, el core ni la nube privada.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://core-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
  }

  # Sin add_header dentro de location: así se heredan las cabeceras de seguridad del server
  location = /sw.js { expires -1; try_files $uri =404; }
  location ~* \.(?:js|css|woff2|png|ico|webmanifest)$ { expires 30d; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
